name: Prerelease
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

env:
  # A stalled cache restore (as when the account is over its cache egress
  # limit) otherwise holds the job for the default 10 minute segment timeout
  # before carrying on as a cache miss.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

jobs:
  prerelease:
    name: Prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 10

    steps:
      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with: 
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Publish Prerelease
        run: |
          pnpm clean
          pnpm changeset:prepublish
          pnpx pkg-pr-new publish --pnpm --compact .
